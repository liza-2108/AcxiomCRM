{% extends "base.html" %}{% block title %}Register | AcxiomCRM{% endblock %}
{% block content %}<div class="auth-card card shadow-sm"><div class="card-body p-4"><h3>Create account</h3><p class="text-muted">New accounts receive the Sales Executive role.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Full name</label><input class="form-control mb-3" name="name" maxlength="100" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required>
<button class="btn btn-primary w-100">Register</button></form><p class="mt-3 mb-0 text-center"><a href="{{ url_for('login') }}">Back to login</a></p></div></div>{% endblock %}
