{% extends "base.html" %}{% block title %}Login | AcxiomCRM{% endblock %}
{% block content %}<div class="auth-card card shadow-sm"><div class="card-body p-4"><h3 class="mb-1">Welcome back</h3><p class="text-muted">Sign in to your CRM account</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
<button class="btn btn-primary w-100">Login</button></form>
<p class="mt-3 mb-0 text-center">New user? <a href="{{ url_for('register') }}">Create account</a></p>
<div class="small text-muted mt-3">Demo admin: admin@acxiomcrm.local / Admin@123</div></div></div>{% endblock %}
