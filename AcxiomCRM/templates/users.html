{% extends "base.html" %}{% block title %}Users | AcxiomCRM{% endblock %}
{% block content %}<h2 class="mb-3">User & Role Management</h2><div class="card mb-4"><div class="card-body"><h5>Create User</h5><form method="post" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-3"><input class="form-control" name="name" placeholder="Full name" required></div><div class="col-md-3"><input class="form-control" name="email" type="email" placeholder="Email" required></div><div class="col-md-3"><input class="form-control" name="password" type="password" minlength="8" placeholder="Password (8+ chars)" required></div><div class="col-md-2"><select class="form-select" name="role"><option>SalesExecutive</option><option>Manager</option><option>Admin</option></select></div><div class="col-md-1"><button class="btn btn-primary">Add</button></div></form></div></div>
<table class="table table-hover"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>{% for u in rows %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{{ 'Active' if u.active else 'Inactive' }}</td><td><form method="post" action="{{ url_for('toggle_user',user_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-secondary">{{ 'Deactivate' if u.active else 'Activate' }}</button></form></td></tr>{% endfor %}</tbody></table>{% endblock %}
